<div class="login-container">
  <!--(ngSubmit) captura el Enter. ngSubmit viene de FormsModule, que login.ts ya importa-->
  <form class="login-card" (ngSubmit)="submit()">
    <h2>Iniciar sesión</h2>

    <!--Credenciales de prueba-->
    <div class="test-credentials">
      <p><strong>Correo de prueba:</strong> soportetiav@gmail.com</p>
      <p><strong>Contraseña de prueba:</strong> 12345678</p>
    </div>

    <!--[(ngModel)]: -->
    <input type="text" name="email" placeholder="Correo electronico" [(ngModel)]="email"/>
    <input type="password" name="password" placeholder="Contraseña" [(ngModel)]="password"/>

    <!--Aviso para usar correo propio-->
    <p class="mail-note">Para que el correo te llegue a tu bandeja debes agregar un usuario con un correo propio</p>

    <div class="forgot-container">
      <a routerLink="/forgot-password">
        ¿Olvidaste tu contraseña?
      </a>
    </div>

    <!--type="submit" (o simplemente type) es el que dispara el Enter-->
    <button type="submit">Entrar</button>
  </form>
</div>
